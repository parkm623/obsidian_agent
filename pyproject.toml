[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-agent"
version = "0.1.0"
description = "Local MCP server and CLI for managing an Obsidian vault as a personal knowledge system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp",
]

[project.scripts]
obsidian-agent = "server:cli_entry"

[tool.setuptools]
py-modules = ["server"]
packages = ["obsidian_agent"]
